      memorial: { head: '#3A3F47', today: '#3A3F47', tint: '#F0F1F3', cover: '#3A3F47', accent: '#4A515B', greet: '희생하신 분들을 기억합니다' },
      constitution: { head: '#1E4D5C', today: '#1E4D5C', tint: '#EAF3F5', cover: '#1E4D5C', accent: '#1E4D5C', greet: '헌법이 세워진 날, 제헌절' },
      liberation: { head: '#173A6B', today: '#173A6B', tint: '#EAF0F9', cover: '#173A6B', accent: '#173A6B', greet: '빛을 되찾은 날, 광복절' },
      gaecheon: { head: '#245E91', today: '#245E91', tint: '#EAF2FA', cover: '#245E91', accent: '#245E91', greet: '하늘이 열린 날, 개천절' },
      christmas: { head: '#1D4A3A', today: '#1D4A3A', tint: '#EEF5EF', cover: '#1D4A3A', accent: '#2F6A50', greet: '메리 크리스마스' }
    };
    const BASE = { head: '#01295F', today: '#01295F', tint: 'transparent', cover: '#46679C', accent: '#01295F' };
    const FB = {
      newyear: '#F8DCC8', seollal: '#F6D5DF', samil: '#DCE3F0', labor: '#EADBC6', children: '#D3E6FA',
      buddha: '#D6EAE7', memorial: '#E1E3E7', constitution: '#D3E7EC', liberation: '#D5E1F3',
      chuseok: '#DADFF4', gaecheon: '#D2E4F5', hangul: '#E8DFCC', christmas: '#D8EADB'
    };
    const BAND = {
      newyear: { bg: '#FBDDBF', icon: '#7A3E22' },
      seollal: { bg: 'linear-gradient(180deg,#F6B0B0 0 6px,#FBE38E 6px 12px,#B5DDB1 12px 18px,#B4CDF0 18px 24px,#F4BEDB 24px 30px)', icon: '#4A1A30' },
      chuseok: { bg: '#2B3468', icon: '#FFFFFF' },
      hangul: { bg: '#F3E7CF', icon: '#6B4B32' },
      samil: { bg: '#F2ECDF', icon: '#2B3A5C' },
      labor: { bg: '#E6D2B5', icon: '#5B4636' },
      children: { bg: '#DCEBFA', icon: '#24507F' },
      buddha: { bg: '#D9EBE8', icon: '#21444A' },
      memorial: { bg: '#E4E6E9', icon: '#3A3F47' },
      constitution: { bg: '#D7E8EC', icon: '#1E4D5C' },
      liberation: { bg: '#FBE3EA', icon: '#173A6B' },
      gaecheon: { bg: '#D9E9F7', icon: '#245E91' },
      christmas: { bg: '#DCEBDD', icon: '#2F5A45' }
    };
    const DD = {
      newyear: { name: '1분기 계획 제출', t: [2027, 1, 15] },
      seollal: { name: '봄 워크숍', t: [2027, 3, 5] },
      chuseok: { name: '하반기 점검 회의', t: [2027, 9, 30] },
      hangul: { name: '보고서 제출', t: [2027, 10, 22] },
      samil: { name: '상반기 교육', t: [2027, 3, 12] },
      labor: { name: '분기 실적 보고', t: [2027, 5, 14] },
      children: { name: '가족 여행', t: [2027, 5, 22] },
      buddha: { name: '워크숍 발표', t: [2027, 5, 28] },
      memorial: { name: '상반기 마감', t: [2027, 6, 30] },
      constitution: { name: '여름 휴가', t: [2027, 8, 2] },
      liberation: { name: '하반기 계획 제출', t: [2027, 8, 27] },
      gaecheon: { name: '가을 워크숍', t: [2027, 10, 15] },
      christmas: { name: '연말 보고서 마감', t: [2026, 12, 31] }
    };
    const MEMO = {
      newyear: { title: '새해 할 일', lines: [['다이어리 새로 쓰기', 1], ['1분기 계획 초안', 0], ['연락처 정리', 0]], note: '목표: 매일 30분 걷기' },
      seollal: { title: '연휴 전 할 일', lines: [['선물 주문', 1], ['기차표 확인', 0], ['부재중 안내 설정', 0]], note: '9일(화)까지 대체공휴일' },
      chuseok: { title: '한가위 준비', lines: [['귀성 기차표', 1], ['선물 포장', 0], ['부재중 안내 설정', 0]], note: '17일(금) 연차 신청' },
      hangul: { title: '이번 주', lines: [['보도자료 맞춤법 점검', 1], ['회의록 정리', 0], ['자료 공유', 0]], note: '11일(월) 대체공휴일' },
      samil: { title: '이번 주', lines: [['태극기 달기', 1], ['주간 보고', 0], ['교육 신청', 0]], note: '2일(화) 오전 회의' },
      labor: { title: '쉬는 날 할 일', lines: [['늦잠 자기', 1], ['운동 1시간', 0], ['책 한 권 읽기', 0]], note: '3일(월)까지 대체공휴일' },
      children: { title: '어린이날', lines: [['선물 포장', 1], ['놀이공원 예약 확인', 0], ['사진 정리', 0]], note: '8일 어버이날 꽃 주문' },
      buddha: { title: '쉬는 날', lines: [['산책 코스 찾기', 1], ['장보기', 0], ['발표 자료 다듬기', 0]], note: '14일(금) 오후 반차' },
      memorial: { title: '이번 주', lines: [['조기 달기', 1], ['주간 계획', 0], ['자료 정리', 0]], note: '오전 10시 묵념' },
      constitution: { title: '휴가 준비', lines: [['숙소 예약', 1], ['업무 인수인계', 0], ['짐 목록', 0]], note: '19일(월)까지 대체공휴일' },
      liberation: { title: '이번 주', lines: [['태극기 달기', 1], ['독립기념관 예약', 0], ['주간 보고', 0]], note: '16일(월) 대체공휴일' },
      gaecheon: { title: '연휴 할 일', lines: [['태극기 달기', 1], ['등산 준비물', 0], ['사진 백업', 0]], note: '4일(월) 대체공휴일' },
      christmas: { title: '연말 할 일', lines: [['카드 보내기', 1], ['송년회 장소 예약', 0], ['연말 보고서', 0]], note: '31일 오후 반차' }
    };
    const SCH = {
      newyear: [['해돋이 산책', '07:00', '#FFD166'], ['가족 점심', '12:30', '#4CC9F0']],
      seollal: [['할머니 댁 방문', '10:00', '#FF6B6B'], ['윷놀이', '15:00', '#FFD166']],
      chuseok: [['성묘', '09:00', '#4CC9F0'], ['송편 빚기', '15:00', '#FFD166']],
      hangul: [['한글 박물관 관람', '14:00', '#4CC9F0'], ['가을 산책', '17:00', '#FFD166']],
      samil: [['태극기 달기', '08:00', '#4CC9F0'], ['가족 나들이', '13:00', '#FFD166']],
      labor: [['브런치 약속', '11:00', '#FFD166'], ['영화 관람', '16:00', '#4CC9F0']],
      children: [['놀이공원', '10:00', '#FF6B6B'], ['가족 외식', '18:00', '#FFD166']],
      buddha: [['사찰 산책', '10:00', '#4CC9F0'], ['가족 점심', '12:30', '#FFD166']],
      memorial: [['조기 달기', '08:00', '#4CC9F0'], ['묵념', '10:00', '#FFD166']],
      constitution: [['태극기 달기', '08:00', '#4CC9F0'], ['도서관', '14:00', '#FFD166']],
      liberation: [['태극기 달기', '08:00', '#4CC9F0'], ['경축식 시청', '10:00', '#FFD166']],
      gaecheon: [['가을 등산', '08:00', '#FFD166'], ['가족 저녁', '18:00', '#4CC9F0']],
      christmas: [['케이크 찾기', '15:00', '#FF6B6B'], ['가족 저녁', '18:30', '#FFD166']]
    };
    const NEWK = ['samil', 'labor', 'children', 'buddha', 'memorial', 'constitution', 'liberation', 'gaecheon'];
    const MARK = ['#FFD166', '#4CC9F0', '#FF6B6B'];
    const WD = ['일', '월', '화', '수', '목', '금', '토'];

    const p = B ? PAL[holiday] : BASE;
    const meta = META[holiday];
    const pad = (n) => String(n).padStart(2, '0');
    const keyOf = (d) => meta.y + '-' + pad(meta.m) + '-' + pad(d);
    const first = new Date(meta.y, meta.m - 1, 1).getDay();
    const dim = new Date(meta.y, meta.m, 0).getDate();
    const rows = Math.ceil((first + dim) / 7);
    const rowH = Math.floor(300 / rows);

    const cells = [];
    for (let i = 0; i < rows * 7; i++) {
      const d = i - first + 1;
      const inMonth = d >= 1 && d <= dim;
      const wd = i % 7;
      const name = inMonth ? (HOL[keyOf(d)] || '') : '';
      const isToday = inMonth && d === meta.d;
      const inPeriod = on && name !== '' && name.indexOf(meta.key) !== -1;
      const red = inMonth && (wd === 0 || name !== '');
      let bg = 'transparent';
      if (isToday) bg = p.today;
      else if (inPeriod && B) bg = p.tint;
      const numColor = isToday ? '#FFFFFF' : red ? '#D14349' : wd === 6 ? '#3474AE' : '#3E4245';
      let marks = [];
      if (inMonth) {
        if (isToday) marks = SCH[holiday].map((s) => s[2]);
        else {
          const r = (d * 37 + meta.m * 11) % 10;
          if (r < 2) marks = [MARK[d % 3]];
          else if (r === 2) marks = [MARK[d % 3], MARK[(d + 1) % 3]];
        }
      }
      const orn = inPeriod && !isToday;
      cells.push({
        num: inMonth ? String(d) : '',
        hname: name.replace(/\(.*\)/, ''),
        wrap: 'position:relative;height:' + rowH + 'px;box-sizing:border-box;padding-top:6px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:7px;background:' + bg + ';',
        numStyle: 'font-size:12px;line-height:16px;font-weight:' + (isToday ? 700 : 400) + ';color:' + numColor + ';',
        hStyle: 'font-size:9px;line-height:11px;height:11px;white-space:nowrap;max-width:48px;overflow:hidden;color:' + (isToday ? 'rgba(255,255,255,0.9)' : '#C9474C') + ';',
        marks: marks.map((c) => ({ style: 'width:5px;height:5px;border-radius:1px;background:' + c + ';' })),
        oX: orn && holiday === 'christmas',
        oN: orn && holiday === 'newyear',
        oS: orn && holiday === 'seollal',
        oC: orn && holiday === 'chuseok',
        oH: orn && holiday === 'hangul',
        oG: orn && NEWK.indexOf(holiday) !== -1,
        gStyle: 'position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:' + p.accent + ';'
      });
    }

    let seed = 11;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const flakes = (n, w, h, smin, smax) => {
      const out = [];
      for (let i = 0; i < n; i++) {
        const s = (smin + rnd() * (smax - smin)).toFixed(1);
        const x = Math.round(rnd() * (w - 4));
        const top = Math.round(2 + rnd() * (h - 8));
        const dur = (5 + rnd() * 4).toFixed(1);
        const delay = (-rnd() * 9).toFixed(1);
        const dx = Math.round(-8 + rnd() * 16);
        const op = (0.45 + rnd() * 0.5).toFixed(2);
        out.push({ style: 'position:absolute;left:' + x + 'px;top:' + top + 'px;width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:#FFFFFF;opacity:' + op + ';--y0:' + (-(top + 6)) + 'px;--y1:' + (h + 2 - top) + 'px;--dx:' + dx + 'px;' + anim('cnSnow ' + dur + 's linear ' + delay + 's infinite') });
      }
      return out;
    };
    const isX = on && holiday === 'christmas';
    const hFlakes = isX ? flakes(B ? 26 : 16, 380, 70, 2, B ? 4.5 : 3.5) : [];
    const dFlakes = isX && B ? flakes(9, 220, 95, 1.8, 3.2) : [];

    const star = (x, y, s, fill, dur, delay) => ({ fill: fill, style: 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + s + 'px;height:' + s + 'px;color:' + fill + ';' + anim('cnTwinkle ' + dur + 's ease-in-out ' + delay + 's infinite alternate') });
    let hStars = [];
    let dStars = [];
    if (on && holiday === 'chuseok') {
      hStars = [star(96, 10, 7, '#FFF4CC', 2.2, 0), star(126, 52, 5, '#FFF4CC', 1.8, -0.6), star(352, 8, 6, '#FFF4CC', 2, -0.3)];
      if (A) hStars.push(star(300, 56, 6, '#FFF4CC', 2.6, -1.2));
      if (B) hStars.push(star(16, 8, 5, '#FFF4CC', 2.4, -0.9), star(238, 12, 5, '#FFF4CC', 1.9, -1.5), star(274, 6, 6, '#FFF4CC', 2.3, -0.5));
      dStars = [star(150, 40, 6, '#FFF4CC', 2, 0), star(204, 58, 5, '#FFF4CC', 2.4, -0.8)];
      if (B) dStars.push(star(128, 56, 4, '#FFF4CC', 1.7, -1.1), star(140, 30, 4, '#FFF4CC', 2.2, -0.4));
    }
    if (on && holiday === 'newyear') {
      hStars = [star(98, 12, 7, '#FFD9A0', 2.4, 0), star(124, 48, 5, '#FFD9A0', 2, -0.7), star(356, 9, 6, '#FFD9A0', 2.2, -1.3)];
    }
    if (on && holiday === 'constitution') {
      hStars = [star(236, 6, 6, '#F4E3B0', 2.2, 0), star(287, 4, 5, '#F4E3B0', 1.9, -0.8)];
    }

    const JAMO = [[80, 'ㄱ', 28], [100, 'ㅎ', 40], [119, 'ㅏ', 24], [248, 'ㄴ', 36], [266, 'ㅇ', 22]];
    const jamo = on && holiday === 'hangul' ? JAMO.map((j, i) => {
      const op = B ? 0.55 : 0.4;
      return { ch: j[1], style: 'position:absolute;left:' + j[0] + 'px;top:' + j[2] + 'px;font-size:' + (13 + (i % 3)) + 'px;font-weight:700;line-height:1;color:' + (B ? '#EADFC8' : '#FFFFFF') + ';opacity:' + (motion ? 0 : op) + ';--op:' + op + ';' + anim('cnFloat ' + (6 + (i % 3)) + 's ease-in-out ' + (-i * 1.3).toFixed(1) + 's infinite') };
    }) : [];

    const st = {
      swing: anim('cnSwing 2.6s ease-in-out infinite alternate'),
      swingSlow: anim('cnSwing 3.4s ease-in-out infinite alternate'),
      rise: anim('cnRise 3.5s ease-out both'),
      glow: anim('cnGlow 3s ease-in-out infinite alternate'),
      sway: anim('cnSway 3.2s ease-in-out infinite alternate'),
      sway2: anim('cnSway 2.7s ease-in-out -1.1s infinite alternate'),
      kite: anim('cnKite 3.8s ease-in-out infinite alternate'),
      spin: anim('cnSpin 3.2s linear infinite'),
      spin2: anim('cnSpin 4.2s linear -1s infinite'),
      spinSlow: anim('cnSpin 80s linear infinite'),
      bob: anim('cnBob 2.4s ease-in-out infinite alternate'),
      bob2: anim('cnBob 2.9s ease-in-out -1s infinite alternate'),
      bob3: anim('cnBob 2.1s ease-in-out -0.4s infinite alternate'),
      wave: anim('cnWave 1.8s ease-in-out infinite alternate'),
      drift: anim('cnDrift 7s ease-in-out infinite alternate'),
      drift2: anim('cnDrift 9s ease-in-out -3s infinite alternate'),
      steam1: anim('cnSteam 2.6s ease-out infinite'),
      steam2: anim('cnSteam 2.6s ease-out -0.9s infinite'),
      steam3: anim('cnSteam 2.6s ease-out -1.7s infinite'),
      prop: anim('cnProp 0.45s linear infinite')
    };

    const is = (h) => on && holiday === h;
    const f = {
      on: on, A: A, B: B,
      x: is('christmas'), n: is('newyear'), s: is('seollal'), c: is('chuseok'), h: is('hangul'),
      xA: A && holiday === 'christmas', xB: B && holiday === 'christmas',
      nA: A && holiday === 'newyear', nB: B && holiday === 'newyear',
      sA: A && holiday === 'seollal', sB: B && holiday === 'seollal',
      cA: A && holiday === 'chuseok', cB: B && holiday === 'chuseok',
      hA: A && holiday === 'hangul', hB: B && holiday === 'hangul'
    };
    NEWK.forEach((k) => { f[k] = is(k); f[k + 'B'] = B && holiday === k; });
    const crowd = f.samilB ? [[14, 1.5, 0], [44, 1.8, -0.5], [154, 1.6, -0.9], [204, 1.4, -0.3], [318, 1.7, -1.1], [350, 1.5, -0.7]].map((c) => ({ style: 'position:absolute;left:' + c[0] + 'px;top:48px;width:18px;height:26px;transform-origin:2.5px 26px;' + anim('cnWave ' + c[1] + 's ease-in-out ' + c[2] + 's infinite alternate') })) : [];
    const LC = ['#F48FB1', '#FFD166', '#EF6C6C', '#8BD3A0', '#FFB870'];
    const LT = [[18, 4], [62, 6], [104, 7], [146, 6], [188, 3], [230, 6], [272, 7], [316, 7], [356, 5]];
    const lanterns = f.buddhaB ? LT.map((l, i) => ({ style: 'position:absolute;left:' + l[0] + 'px;top:' + l[1] + 'px;width:12px;height:18px;color:' + LC[i % 5] + ';transform-origin:6px 0;filter:drop-shadow(0 0 3px ' + LC[i % 5] + ');' + anim('cnSwing ' + (2.6 + (i % 3) * 0.4).toFixed(1) + 's ease-in-out ' + (-i * 0.5).toFixed(1) + 's infinite alternate') })) : [];

    const dd = DD[holiday];
    const delta = Math.round((Date.UTC(dd.t[0], dd.t[1] - 1, dd.t[2]) - Date.UTC(meta.y, meta.m - 1, meta.d)) / 86400000);
    const dday = {
      name: dd.name,
      count: delta > 0 ? 'D-' + delta : delta === 0 ? 'D-Day' : 'D+' + (-delta),
      date: dd.t[0] + '.' + pad(dd.t[1]) + '.' + pad(dd.t[2]) + ' (' + WD[new Date(dd.t[0], dd.t[1] - 1, dd.t[2]).getDay()] + ')'
    };

    const memo = MEMO[holiday];
    const band = B ? BAND[holiday] : { bg: '#F8F26F', icon: '#3D4A5C' };

    return {
      p: p,
      f: f,
      st: st,
      cells: cells,
      hFlakes: hFlakes,
      dFlakes: dFlakes,
      hStars: hStars,
      dStars: dStars,
      jamo: jamo,
      focusBg: 'linear-gradient(135deg,#FFFFFF 0%,' + (B ? PAL[holiday].tint : '#EEF6FF') + ' 48%,' + (B ? FB[holiday] : '#DDE8FF') + ' 100%)',
      crowd: crowd,
      lanterns: lanterns,
      dday: dday,
      memo: memo,
      lines: memo.lines.map((l) => ({ text: l[0], done: l[1] === 1, todo: l[1] !== 1 })),
      band: band,
      stickyHead: 'position:relative;height:30px;flex-shrink:0;background:' + band.bg + ';',
      stickerStyle: A ? 'position:absolute;right:12px;bottom:12px;width:40px;height:40px;' : 'position:absolute;right:10px;bottom:10px;width:56px;height:56px;transform:rotate(-6deg);',
      sealFs: A ? 10 : 14,
      headStyle: 'position:relative;height:70px;flex-shrink:0;overflow:hidden;background:' + p.head + ';',
      monthLabel: (meta.y % 100) + '년 ' + meta.m + '월',
      selLabel: meta.m + '월 ' + meta.d + '일 ' + WD[new Date(meta.y, meta.m - 1, meta.d).getDay()] + '요일',
      selHol: (HOL[keyOf(meta.d)] || '').replace(/\(.*\)/, ''),
      greet: B ? PAL[holiday].greet : '',
      sch: SCH[holiday].map((s) => ({ text: s[0], time: s[1], dot: 'width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + s[2] + ';' }))
    };
  }
}
</script>
</body>
